<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Assistance Digital Ecosystem — Reality Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1116; --panel:#161C24; --panel-2:#1C232D; --line:#2A323D;
    --text:#E8ECF2; --muted:#8A95A5; --faint:#5C6675;
    --loss:#FF5A2C; --warn:#F2B53D; --recover:#34C77B;
    --shadow:0 18px 50px rgba(0,0,0,.45);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1A222D 0%, var(--ink) 55%) fixed,
      var(--ink);
    color:var(--text); font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:18px;
  }
  .wrap{width:100%; max-width:560px; display:flex; flex-direction:column; gap:14px; flex:1}
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand-txt{display:flex; flex-direction:column; line-height:1.06; min-width:0}
  .brand-name{font-family:"Saira"; font-weight:700; font-size:.92rem; letter-spacing:.01em;
    color:var(--text); white-space:nowrap}
  .brand-name .r{color:var(--loss)}
  .brand-sub{font-family:"Saira"; font-weight:600; font-size:.53rem; letter-spacing:.15em;
    text-transform:uppercase; color:var(--muted); white-space:nowrap; margin-top:3px}
  .brand-mod{font-family:"Saira"; font-weight:700; font-size:1.08rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--text); white-space:nowrap;
    padding-left:12px; margin-left:2px; border-left:1px solid var(--line)}
  @media (max-width:600px){
    .brand-name{font-size:.82rem} .brand-sub{font-size:.47rem; letter-spacing:.1em}
    .brand-mod{font-size:.88rem; padding-left:9px} .top{gap:6px}
  }
  @media (min-width:901px){
    .brand-name{font-size:1rem} .brand-sub{font-size:.58rem}
    .brand-mod{font-size:1.12rem; padding-left:14px}
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--loss);
    box-shadow:0 0 0 4px rgba(255,90,44,.15)}
  .lang{display:flex; gap:2px; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:3px}
  .lang button{all:unset; cursor:pointer; font-family:"Saira"; font-weight:600; font-size:.74rem;
    letter-spacing:.05em; padding:5px 11px; border-radius:999px; color:var(--muted)}
  .lang button[aria-pressed="true"]{background:var(--panel-2); color:var(--text)}
  .bar{height:3px; background:var(--line); border-radius:2px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--warn),var(--loss));
    transition:width .5s cubic-bezier(.4,0,.1,1)}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:28px 24px; flex:1; display:flex; flex-direction:column;
    min-height:420px; position:relative; overflow:hidden}
  .eyebrow{font-family:"Saira"; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    font-size:.7rem; color:var(--loss); margin-bottom:14px}
  h1{font-family:"Saira"; font-weight:700; font-size:clamp(1.5rem,6vw,2.05rem); line-height:1.08;
    margin:0 0 14px; letter-spacing:-.01em}
  h1 .hl{color:var(--loss)}
  p.lead{color:var(--text); font-size:1.02rem; margin:0 0 12px}
  p.sub{color:var(--muted); font-size:.95rem; margin:0 0 12px}
  .grow{flex:1}
  .timeline{margin:18px 0; border:1px solid var(--line); border-radius:10px; padding:16px 14px;
    background:var(--panel-2)}
  .tl-row{display:flex; align-items:center; gap:8px; font-family:"JetBrains Mono"; font-size:.72rem;
    color:var(--muted); margin-bottom:9px}
  .tl-row:last-child{margin-bottom:0}
  .tl-day{color:var(--faint); width:54px; flex:none}
  .tl-track{flex:1; height:8px; border-radius:5px; background:#222a34; position:relative; overflow:hidden}
  .tl-track i{position:absolute; inset:0; width:0; border-radius:5px}
  .tl-in i{background:var(--recover)}
  .tl-out i{background:var(--loss)}
  .tl-gap{background:repeating-linear-gradient(45deg,rgba(255,90,44,.18) 0 6px,transparent 6px 12px);
    border:1px dashed rgba(255,90,44,.5)}
  .opts{display:grid; gap:10px; margin-top:6px}
  .opt{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    gap:12px; border:1px solid var(--line); background:var(--panel-2); border-radius:11px;
    padding:15px 16px; font-size:1rem; font-weight:500; transition:border-color .15s, background .15s, transform .08s}
  .opt:hover{border-color:#3c4654}
  .opt:active{transform:scale(.99)}
  .opt[aria-pressed="true"]{border-color:var(--loss); background:rgba(255,90,44,.08)}
  .opt .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex:none}
  .opt[aria-pressed="true"] .tick{border-color:var(--loss); background:var(--loss);
    box-shadow:inset 0 0 0 3px var(--panel-2)}
  .opt:focus-visible{outline:2px solid var(--warn); outline-offset:2px}
  .gauge{margin:6px auto 2px; width:100%; max-width:330px; display:block}
  .readout{text-align:center; margin-top:-8px}
  .readout .x{font-family:"JetBrains Mono"; font-weight:700; font-size:clamp(2rem,10vw,2.9rem);
    color:var(--loss); letter-spacing:-.02em; line-height:1}
  .readout .xlab{font-family:"Saira"; letter-spacing:.12em; text-transform:uppercase; font-size:.66rem;
    color:var(--muted); margin-top:4px}
  .readout .x.prod{color:var(--text)}
  .lossline{text-align:center; margin-top:10px}
  .lossline .lv{font-family:"JetBrains Mono"; font-weight:700; font-size:1.5rem; color:var(--loss); line-height:1}
  .lossline .ll{font-family:"Saira"; text-transform:uppercase; letter-spacing:.1em; font-size:.6rem; color:var(--muted); display:block; margin-top:3px}
  .rec{margin-top:14px; border:1px solid rgba(52,199,123,.35); background:rgba(52,199,123,.07);
    border-radius:11px; padding:12px 15px; display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .rec .z{font-family:"JetBrains Mono"; font-weight:700; font-size:1.4rem; color:var(--recover)}
  .rec .zl{font-size:.82rem; color:var(--muted)}
  .rec-split{margin:8px 0 0; display:grid; gap:7px; padding:2px 4px 0}
  .rec-line{display:flex; justify-content:space-between; align-items:baseline; font-size:.82rem; color:var(--muted)}
  .rec-line i{font-style:normal; font-family:"JetBrains Mono"; font-size:.7rem; color:var(--recover); margin-left:5px}
  .rec-line b{font-family:"JetBrains Mono"; color:var(--text); font-weight:600; font-size:.86rem}
  .cta-recap{margin:20px 0 4px; padding-top:18px; border-top:1px solid var(--line)}
  .cta-recap .cr-lab{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .cta-recap .readout{margin-top:0}
  .bd{margin-top:14px; border:1px solid var(--line); border-radius:11px; padding:12px 14px;
    background:var(--panel-2); font-family:"JetBrains Mono"; font-size:.78rem; color:var(--muted)}
  .bd-row{display:flex; justify-content:space-between; gap:10px; padding:4px 0}
  .bd-row b{color:var(--text); font-weight:700}
  .bd-row.tot{border-top:1px solid var(--line); margin-top:4px; padding-top:8px; color:var(--text)}
  .bd-row.tot b{color:var(--loss)}
  .sliders{margin-top:16px; display:grid; gap:15px}
  .sl{display:block}
  .sl-top{display:flex; justify-content:space-between; align-items:baseline; font-size:.85rem;
    color:var(--muted); margin-bottom:7px}
  .sl-top b{color:var(--text); font-family:"JetBrains Mono"; font-weight:700}
  input[type=range]{width:100%; accent-color:var(--loss); height:22px; cursor:pointer}
  input.track-zone{-webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:5px;
    cursor:pointer; outline:none; accent-color:auto;
    background:linear-gradient(90deg,var(--loss) 0 12%,var(--warn) 12% 28%,var(--recover) 28% 100%)}
  input.track-zone::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:20px; height:20px;
    border-radius:50%; background:#fff; border:3px solid var(--ink); box-shadow:0 1px 5px rgba(0,0,0,.55); cursor:pointer}
  input.track-zone::-moz-range-track{height:8px; border-radius:5px;
    background:linear-gradient(90deg,var(--loss) 0 12%,var(--warn) 12% 28%,var(--recover) 28% 100%)}
  input.track-zone::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:#fff;
    border:3px solid var(--ink); cursor:pointer}
  .prodline{text-align:center; font-size:.82rem; color:var(--muted); margin-top:2px}
  .prodline b{font-family:"JetBrains Mono"; font-weight:700}
  .assume{font-size:.8rem; color:var(--muted); margin:14px 0 0; line-height:1.5}
  .note{font-size:.78rem; color:var(--faint); text-align:center; margin-top:12px; font-style:italic}
  .stdpanel{margin-top:14px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.02); padding:0 14px}
  .stdpanel summary{cursor:pointer; padding:12px 0; font-weight:700; font-size:.92rem; list-style:none; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .stdpanel summary::-webkit-details-marker{display:none}
  .stdpanel[open] summary{border-bottom:1px solid var(--line)}
  .std-hint{font-weight:400; font-size:.76rem; color:var(--faint); font-style:italic}
  .stdpanel .sliders{padding-bottom:8px}
  .ca-extra{margin-top:10px}
  .ca-extra input[type=number]{width:100%; background:var(--ink); border:1px solid var(--line);
    border-radius:9px; color:var(--text); font-family:"JetBrains Mono"; font-weight:700;
    font-size:1rem; padding:10px 12px; outline:none; -moz-appearance:textfield}
  .ca-extra input[type=number]:focus{border-color:var(--loss)}
  .ca-extra input::-webkit-outer-spin-button,.ca-extra input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .ca-hint{font-size:.74rem; color:var(--faint); margin-top:7px; line-height:1.55}
  .ca-hint b{color:var(--muted); font-family:"JetBrains Mono"}
  .ca-hint a{color:var(--recover); text-decoration:none; border-bottom:1px dotted var(--recover)}
  .ca-hint a:hover{color:var(--text)}
  .xsub{font-family:"JetBrains Mono"; font-size:.72rem; color:var(--faint); margin-top:4px; letter-spacing:.02em}
  .prodref{font-family:"JetBrains Mono"; font-size:.74rem; color:var(--muted); margin-top:6px; letter-spacing:.02em}
  .recsub{font-family:"JetBrains Mono"; font-size:.72rem; color:var(--loss); text-align:right; margin:3px 4px 0; letter-spacing:.02em}
  .partsrow{font-family:"JetBrains Mono"; font-size:.68rem; color:var(--faint); text-align:right; margin:6px 4px 0; letter-spacing:.02em; line-height:1.5}
  .partsrow .pl-tag{font-family:"Saira"; font-size:.56rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px; margin-left:3px}
  .meters-h{font-family:"Saira"; font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:18px 0 9px}
  .meter{margin-top:11px}
  .meter.prime{padding:11px 12px; border:1px solid var(--line); border-left:3px solid var(--info); border-radius:9px; background:rgba(79,145,232,.05)}
  .drv{font-family:"JetBrains Mono"; font-size:.58rem; letter-spacing:.08em; text-transform:uppercase; color:var(--info); border:1px solid var(--info); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle}
  .meter-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px}
  .meter-top .mn{font-family:"Saira"; font-size:.78rem; color:var(--text)}
  .meter-top .mv{font-family:"JetBrains Mono"; font-size:.72rem; color:var(--faint)}
  .meter-top .mv b{color:var(--text)}
  .meter-track{height:11px; border-radius:5px; position:relative; overflow:hidden;
    background:repeating-linear-gradient(45deg, rgba(52,199,123,.22) 0 6px, rgba(52,199,123,.07) 6px 12px);
    border:1px solid rgba(52,199,123,.28)}
  .meter-track i{position:absolute; left:0; top:0; bottom:0; border-radius:5px 0 0 5px; box-shadow:2px 0 0 rgba(232,236,242,.35)}
  .meter-pct{font-family:"JetBrains Mono"; font-size:.66rem; color:var(--faint); text-align:right; margin-top:3px}
  .s1close{margin-top:16px; font-family:"Saira"; font-size:1.05rem; font-weight:700; color:var(--text); line-height:1.4; border-left:3px solid var(--recover); padding-left:12px}
  .s0hook{font-family:"Saira"; font-size:1.05rem; font-weight:400; color:var(--muted); line-height:1.5; margin-bottom:18px; font-style:italic}
  .postinc{margin-top:13px; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--recover); border-radius:9px; background:rgba(52,199,123,.05); display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 8px}
  .postinc .pi-lab{font-family:"Saira"; font-size:.78rem; color:var(--text)}
  .postinc .pi-val{font-family:"Saira"; font-weight:800; font-size:1.02rem; color:var(--recover)}
  .cta-close{margin-top:14px; padding:11px 14px; border-left:3px solid var(--info); border-radius:0 8px 8px 0; background:rgba(79,145,232,.07); font-family:"Saira"; font-size:.9rem; font-weight:600; color:var(--text); line-height:1.4}
  .postinc .pi-sub{flex-basis:100%; font-family:"JetBrains Mono"; font-size:.66rem; color:var(--faint); margin-top:2px}
  .who{display:flex; gap:13px; align-items:center; margin:10px 0 4px; padding:13px;
    border:1px solid var(--line); border-radius:11px; background:var(--panel-2)}
  .ava{width:46px;height:46px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,#2a323d,#1a212a); display:grid; place-items:center;
    font-family:"Saira"; font-weight:700; color:var(--loss); font-size:1.2rem; border:1px solid var(--line)}
  .who .n{font-family:"Saira"; font-weight:600; font-size:.95rem}
  .who .r{font-size:.8rem; color:var(--muted)}
  .nav{display:flex; gap:10px; margin-top:18px}
  .btn{all:unset; cursor:pointer; text-align:center; font-family:"Saira"; font-weight:600;
    letter-spacing:.03em; padding:15px 18px; border-radius:11px; font-size:1rem; transition:transform .08s, filter .15s}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--warn); outline-offset:2px}
  .btn.primary{flex:1; background:linear-gradient(180deg,#FF6B40,var(--loss)); color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.primary:disabled{opacity:.35; cursor:not-allowed; filter:none}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted)}
  .btn.ghost:hover{border-color:#3c4654; color:var(--text)}
  .cta-sec{margin-top:10px; background:transparent; border:1px solid var(--line); color:var(--muted);
    width:100%; box-sizing:border-box}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:13px 18px;
    border-radius:11px; font-size:.9rem; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; max-width:90vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  details.admin{width:100%; max-width:560px; margin-top:4px; font-size:.82rem}
  details.admin summary{cursor:pointer; color:var(--faint); font-family:"Saira"; letter-spacing:.05em;
    text-transform:uppercase; font-size:.68rem; padding:8px 0; list-style:none}
  details.admin summary::-webkit-details-marker{display:none}
  details.admin summary::before{content:"▸ "; color:var(--loss)}
  details.admin[open] summary::before{content:"▾ "}
  .admin-box{background:#0a0d11; border:1px solid var(--line); border-radius:10px; padding:14px;
    font-family:"JetBrains Mono"; font-size:.74rem; color:var(--muted); white-space:pre-wrap; line-height:1.6}
  .admin-box b{color:var(--text)}
  .tier{display:inline-block; padding:2px 9px; border-radius:999px; font-weight:700; font-size:.72rem}
  .tier.A{background:rgba(255,90,44,.15); color:var(--loss)}
  .tier.B{background:rgba(242,181,61,.15); color:var(--warn)}
  .tier.C{background:rgba(138,149,165,.15); color:var(--muted)}
  .mirror-split{display:block}
  .mirror-left{} .mirror-right{}
  @media (min-width:1200px){
    .mirror-split{display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start}
    .mirror-left .readout .x{font-size:clamp(2.4rem,3vw,3.2rem)}
  }
  .verify{border:1px solid rgba(242,181,61,.4); background:rgba(242,181,61,.08);
    border-radius:11px; padding:16px 16px; margin:6px 0 4px}
  .vh{font-family:"Saira"; font-weight:700; font-size:1.05rem; color:var(--warn); margin-bottom:6px}
  .util-pill{font-family:"JetBrains Mono"; font-weight:700}
  .tgt{font-size:.78rem; color:var(--muted)}
  .exp-pill{display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink); background:var(--recover); padding:2px 7px; border-radius:999px; vertical-align:middle; margin-left:4px}
  .slogan{font-family:"Saira"; font-weight:700; font-size:clamp(1.45rem,5.6vw,2rem);
    line-height:1.12; letter-spacing:-.01em; text-align:center; margin:22px 0 4px;
    border-top:1px solid var(--line); padding-top:22px}
  .slogan .g{color:var(--recover)}
  .vs{display:flex; align-items:stretch; gap:10px; margin:16px 0 6px}
  .vs-col{flex:1; border:1px solid var(--line); background:var(--panel-2); border-radius:11px; padding:13px 14px; min-width:0}
  .vs-lab{font-family:"Saira"; font-weight:700; font-size:.95rem; color:var(--muted)}
  .vs-desc{font-size:.8rem; color:var(--faint); margin-top:3px}
  .vs-real{border-color:rgba(52,199,123,.42); background:rgba(52,199,123,.07)}
  .vs-real .vs-lab{color:var(--recover)}
  .vs-sign{display:grid; place-items:center; font-family:"Saira"; font-weight:700;
    font-size:1.5rem; color:var(--loss); flex:none; width:22px}
  .bottleneck{margin-top:14px; border:1px solid var(--line); background:var(--panel-2);
    border-radius:10px; padding:11px 14px; font-size:.86rem; color:var(--muted); text-align:center}
  .bottleneck b{font-family:"JetBrains Mono"; font-size:1rem}
  .pot-row{margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:.84rem}
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

  /* ===== MOBIL (≤600px) — érintőbarát, nagy gombok ===== */
  @media (max-width:600px){
    body{padding:12px 10px}
    .card{padding:22px 18px; min-height:380px}
    h1{font-size:clamp(1.35rem,6.5vw,1.75rem)}
    .btn{padding:16px 14px; font-size:.97rem}
    .opt{padding:14px 14px}
    .readout .x{font-size:clamp(2.1rem,11vw,2.6rem)}
    .meters-h{margin:14px 0 7px}
    .rec{padding:10px 12px}
    .rec .z{font-size:1.25rem}
    .s0hook{font-size:.97rem}
    .cta-close{font-size:.85rem; padding:10px 12px}
    .timeline{padding:13px 11px}
    .who{padding:11px}
    .postinc{padding:9px 11px}
    .sl-top{font-size:.82rem}
    .meter-top .mn{font-size:.75rem}
    .meter-top .mv{font-size:.68rem}
  }

  /* ===== TABLET (601–900px) ===== */
  @media (min-width:601px) and (max-width:900px){
    body{padding:20px 24px}
    .wrap{max-width:600px}
    .card{padding:30px 28px}
  }

  /* ===== PC (≥901px) — szélesebb kártya, kéthasábos lehetőség ===== */
  @media (min-width:901px){
    body{padding:32px 40px; align-items:center}
    .wrap{max-width:720px; gap:16px}
    .card{padding:38px 42px; min-height:460px; border-radius:18px}
    h1{font-size:clamp(1.6rem,3vw,2.2rem)}
    p.sub{font-size:1rem}
    .btn{padding:17px 24px; font-size:1.05rem; border-radius:12px}
    .opt{padding:16px 20px; font-size:1.02rem; border-radius:13px}
    /* mirror: mérőórák + jövedelem kéthasábos */
    .meters-2col{display:grid; grid-template-columns:1fr 1fr; gap:14px}
    /* vs blokk szélesebb */
    .vs{gap:14px}
    .vs-col{padding:16px 18px}
    /* readout hero nagyobb */
    .readout .x{font-size:clamp(2.6rem,4.5vw,3.4rem)}
    /* timeline wider */

const POSTS_MAP = [1,3,5,8];   // q1 sáv → poszt seed

   működési%(perDay) = OPC_BASE + max(0, TARGET−perDay) × OPC_SLOPE   [6,5→32% · 4,5→38%]
   alkatrész%(perDay)= PARTS_BASE + max(0, TARGET−perDay) × PARTS_SLOPE [6,5→20% · 4,5→25%] */
let  OPC_BASE   = 0.32;        // működési költség a manoperă %-a a 6,5-ös célnál (vállalati standard)

/* ===== manoperă óradíj KALIBRÁLÁS — éves költségalapú padló (Ferenc bázisai) =====
   ASZIMMETRIA: a KÖLTSÉG 12 hónapos (fizetés + adó + működés egész évben), a TERMELÉS csak 230 nap × 6,5 óra.
   A teljes ÉVES bérköltséget a 230 nap × 6,5 óra számlázható órán kell visszahozni.
   nullszaldó = éves bérkölts ÷ ((1−költség%) × éves számlázható óra)  → ez alatt RÁFIZETSZ
   egészséges = éves bérkölts ÷ (bér% × éves számlázható óra)          → ez alatt az eredmény elfogy */
let   salNet       = 6000;     // átlag NETTÓ fizetés / termelő ember / hó (RON) — q1 INPUT, cégenként eltér
/* ROMÁN BÉRTEHER 2026 (Cod Fiscal) — nettóból a TELJES céges költségig:
   nettó = bruttó × (1 − CAS 25% − CASS 10% − impozit 10%×(1−CAS−CASS)) = bruttó × 0,585  (deducere nélkül, tipikus szerelőbérnél)
   céges teljes = bruttó × (1 + CAM 2,25%)  →  a CAM a CÉG (angajator) hozzájárulása */
const TAX_CAS=0.25, TAX_CASS=0.10, TAX_IMPOZIT=0.10, TAX_CAM=0.0225;
const NET_RATIO     = 1 - TAX_CAS - TAX_CASS - TAX_IMPOZIT*(1 - TAX_CAS - TAX_CASS); // 0,585 nettó/bruttó
const EMPLOYER_MULT = (1/NET_RATIO) * (1 + TAX_CAM);                                // nettó → teljes céges költség ≈ 1,748
const SAL_TAX      = EMPLOYER_MULT; // a TÉNYLEGES román teljes bérteher (bruttó + CAM), nem a régi 1,6 közelítés
const BILLABLE_AN_0 = 6.5 * 230;  // referencia 1.495 (csak doksi)
const TARGET_PROFIT= 0.195;    // cél bruttó eredmény-margó (egészséges) — alap 19,5% (38% költségnél a bér 42,5%-ra jön ki)
let   BILLABLE_AN  = TARGET * ZILE_AN;                                    // termelés csak 230 nap × 6,5 ó = 1.495 számlázható óra/ÉV — recalcStd() frissíti
/* a két óradíj-küszöb a FIZETÉSBŐL és a CÉG KÖLTSÉGÉBŐL számol — bármelyik változására ÚJRASZÁMOL */
function salFloor(){
  const loadedAn = salNet * SAL_TAX * 12;                                 // teljes bérköltség / ÉV (12 hó) / termelő ember
  const wagePerHour = loadedAn / BILLABLE_AN;                             // bérköltség / számlázható óra
  return { loadedAn, wagePerHour, breakeven: Math.round(wagePerHour) };  // TISZTA bér-padló — a 38% NEM itt él többé, hanem a hatékonyság-faktorban
}

// Oameni / Posturi: 1–10 az első 50%-on, 10–100 a második 50%-on (poz: 0..1000)
function nlVal(pos){ const x=(+pos)/1000; return Math.round(x<=.5 ? 1+(x/.5)*9 : 10+((x-.5)/.5)*90); }
function nlPos(v){ v=Math.max(1,Math.min(100,+v||1)); return Math.round(v<=10 ? (v-1)/9*500 : 500+(v-10)/90*500); }
// Cifra de afaceri ANUALĂ: logaritmikus skála 1 … 25.000.000 (poz: 0..1000)
const CA_MAX=25000000, CA_LN=Math.log(CA_MAX);
function caVal(pos){ return Math.round(Math.exp(((+pos)/1000)*CA_LN)); }
function caPos(ca){ ca=Math.max(1,Math.min(CA_MAX,+ca||1)); return Math.round(Math.log(ca)/CA_LN*1000); }

function compute(){
  if(answers.q1===null) return null;
  const P  = posts    ?? POSTS_MAP[answers.q1];
  const PE = people   ?? P;                                  // ember default = poszt
  if(cifraUnknown && manopera==null) return {dataUnknown:true, P, PE, inconsistent:false}; // §7: NINCS rejtett default — a hiányzó adat maga a jelzés
  const seedCifra = cifra || 0;                              // nincs hamis 150k; valós cifra-ból számolunk
  const cifraNet  = Math.round(seedCifra * (1 - altePct));   // alte venituri kivonva → csak a service-forgalom
  const F  = manopera ?? Math.round(cifraNet * laborPct);
  if(!F || F<=0 || PE<=0 || P<=0 || tarif<=0) return null;
  const units        = Math.min(PE, P);                      // valós termelő egység = min(ember, poszt)
  const actualTotalH = F / tarif;                            // valós számlázott óra = manoperă ÷ óradíj
  const perDay       = actualTotalH / (units * ZILE);        // valós termelt óra/nap/poszt
  const inconsistent = perDay > POTENTIAL;                   // SZŰRŐ: fizikailag lehetetlen → verificare live
  const tooLow       = !inconsistent && perDay > 0 && perDay < LOW_FLOOR; // P2: gyanúsan alacsony → verificare live (szimmetria)
  const gapPerDay    = Math.max(0, TARGET - perDay);             // rés a 6,5 célig — NINCS kemény plafon (a 0,49 korlátoz)
  const orePierdute  = Math.round(gapPerDay * units * ZILE);     // havi elveszett óra (teljes rés)
  const orePierduteAn= Math.round(gapPerDay * units * ZILE_AN);  // ÉVES elveszett óra (230 munkanap)
  const X            = Math.round(orePierdute * tarif);          // havi ALULTERMELÉSI veszteség (teljes rés, dolgozó emelők)
  const Z            = Math.round(X * RECOVER);                  // havi visszanyerhető = rés × 0,49 (3 intenzív kar)
  /* ===== 4. kar: ÜRES EMELŐ (kapacitás) — KÜLÖN veszteségtípus, NEM adódik a fentihez ===== */
  const emptyLifts   = Math.max(0, P - PE);                      // álló emelő = poszt − ember
  const realCtrlLift = Math.round((ZILE_AN*TARGET*tarif*RESULT_RATIO) + (PARTS_RES_MONTH*PROD_MONTHS)); // Real Control eredmény / emelő / év
  const capLossAn    = Math.round(emptyLifts * realCtrlLift * DEMAND_FACTOR); // éves kinyitható kapacitás (demand-faktorral)
  const capLoss      = Math.round(capLossAn / 12);              // havi
  const monthlyProd  = Math.round(perDay * ZILE);               // termelt óra/hó/poszt
  const oreBazaLuna  = Math.round(actualTotalH);                // össz termelt óra/hó
  const util         = Math.round(perDay / POTENTIAL * 100);    // % a 8 ó fizikai plafonhoz (payload)
  const expert       = perDay >= 7.2 && perDay <= POTENTIAL;    // 7,2–8 ó = zöld / expert szint
  const Xan=X*12, Zan=Z*12;                                     // éves nézet (látvány = sokk)
  const svcTurnAn    = cifraUnknown ? null : Math.round(cifraAnuala*(1-altePct)); // éves nettó service-forgalom
  const incoherent   = !inconsistent && svcTurnAn!=null && svcTurnAn>0 && Xan > svcTurnAn; // P3: veszteség > forgalom = lehetetlen
  const verifyReason = inconsistent ? "high" : (incoherent ? "incoh" : (tooLow ? "low" : null)); // egységes verify-ok
  /* ===== 3 mérőóra: KELLENE vs VAN ===== */
  const benchHoursPost = ZILE_AN * TARGET;                     // 1495 ó/poszt/év (230 × 6,5)
  const benchManopera  = Math.round(units * benchHoursPost * tarif);          // [1] kellene manoperă/év (aktív posztok 6,5 ó-n)
  const actualManopera = Math.round(F * 12);                                  // [1] van manoperă/év
  const fillMano       = benchManopera>0 ? Math.min(100, Math.round(actualManopera/benchManopera*100)) : 0;
  const achievCifra    = laborPct>0 ? Math.round(benchManopera / laborPct) : 0;   // [2] ELÉRHETŐ forgalom = a benchmark-manoperához tartozó forgalom (manoperă vezeti)
  const actualCifraSvc = Math.round((cifra*12) * (1 - altePct));                   // [2] PILLANATNYI forgalom (service net, alte nélkül)
  const fillCifra      = achievCifra>0 ? Math.min(100, Math.round(actualCifraSvc/achievCifra*100)) : 0;
  const venitPerPost  = Math.round(ZILE_AN * POTENTIAL * tarif * UTIL_POST * PROFIT_RATIO); // venit brut / post = 230×8×tarif×86%×41,5%
  const utilPost      = P>0 ? Math.round(units / P * 100) : 0;                 // poszt-kihasználtság %
  /* ===== ALULÁRAZÁS — tarif < 160 RON piaci sáv alja — KÜLÖN, NEM adódik az óraréshez ===== */
  const _sf          = salFloor();
  const tarifGap     = Math.max(0, PRICE_FLOOR - tarif);          // alulárazás a piaci sáv aljától (160)
  const priceLoss    = Math.round(tarifGap * actualTotalH);        // havi alulárazási veszteség a TÉNYLEG számlázott órákon
  const priceLossAn  = Math.round(priceLoss * 12);                 // éves
  const wageCostPerHour = _sf.wagePerHour;                         // bérköltség / számlázható óra (6,5-ös bér-padló referencia)
  /* ===== 2. PONT: ALKATRÉSZ-kereskedelem — variábilis %, KÜLÖN ág (loss a 6,5-ös 20%-on, kijelzett % a perDay-nél) ===== */
  const partsPctNow  = partsPctVar(perDay);                       // alkatrész % a TÉNYLEGES termelésnél (6,5→20% · 4,5→25%)
  const partsRonHour = Math.round(tarif * partsPctNow);           // alkatrész RON / óra (külön ág)
  const partsIncomeMo= Math.round(partsRonHour * actualTotalH);   // havi alkatrész-jövedelem most
  const partsLoss    = Math.round(X * PARTS_BASE);                // havi elveszett alkatrész-profit = kiesett manoperă × 20% (cél-ráta)
  const partsLossAn  = Math.round(Xan * PARTS_BASE);              // éves
  const partsRecov   = Math.round(Z * PARTS_BASE);               // havi visszanyerhető
  const partsRecovAn = Math.round(Zan * PARTS_BASE);             // éves
  /* ===== 3. PONT: VARIÁBILIS ÓRA-GAZDASÁGTAN — a termelés-veszteség valós hatása (bér/óra ÉS működési% is romlik) ===== */
  const wageHourNow  = wageHourV(perDay);                         // variábilis bér/óra: fix éves bér ÷ tényleg termelt óra
  const wageHourOpt  = wageHourV(TARGET);                         // bér/óra a 6,5-ös célnál
  const opcPctNow    = opcPctV(perDay);                           // működési % most (6,5→32% · 4,5→38%)
  const opcRonHour   = Math.round(tarif * opcPctNow);             // működési költség RON/óra (a manoperă %-a)
  const hourResult   = Math.round(tarif - wageHourNow - tarif*opcPctNow); // óra-eredmény (manoperából, alkatrész KÜLÖN) — lehet negatív
  const hourResultOpt= Math.round(tarif - wageHourOpt - tarif*OPC_BASE);  // óra-eredmény a 6,5-ös célnál (referencia)
  const workResultMo = Math.round(hourResult * actualTotalH);     // havi munka-eredmény (lehet negatív)
  const workResultOptMo = Math.round(hourResultOpt * (benchManopera/12)/tarif); // havi munka-eredmény a 6,5-ös célnál
  return {P,PE,F,units,perDay,actualTotalH,inconsistent,tooLow,incoherent,verifyReason,svcTurnAn,expert,orePierdute,orePierduteAn,oreBazaLuna,monthlyProd,util,X,Z,Xan,Zan,emptyLifts,realCtrlLift,capLoss,capLossAn,
    tarifGap,priceLoss,priceLossAn,wageCostPerHour,
    partsPctNow,partsRonHour,partsIncomeMo,partsLoss,partsLossAn,partsRecov,partsRecovAn,
    wageHourNow,wageHourOpt,opcPctNow,opcRonHour,hourResult,hourResultOpt,workResultMo,workResultOptMo,
    benchManopera,actualManopera,fillMano,benchCifra:achievCifra,actualCifraSvc,fillCifra,venitPerPost,utilPost};
}
function score(){
  let s=0;
  s += [0,2,3,3][answers.q1 ?? 0];
  s += [0,0,2,3][answers.q2 ?? 0];
  s += [2,2,1,0][answers.q3 ?? 0];
  if(answers.q4!==null) s += 1;
  const tier = s>=7 ? "A" : s>=4 ? "B" : "C";
  return {s,tier};
}
/* ===== VEVŐPROFIL — apró jelek (q3 érettség + q4 fő fájdalom) billentik =====
   + = optimista (nyereség-nyelv) · − = pesszimista (fájdalom-nyelv) · döntetlen → fájdalom (default).
   Ugyanaz a szám, két ajtó. A provizórikus profil átmegy a payloadba → auditon megerősítve. */
const Q3_TILT=[-1,0,0,1];   // [din cap/deloc, Excel, contabil, software]
const Q4_TILT=[-1,1,-1,-1,-1]; // [haos, nu văd profitul→build, facturi, nu știu bani, rechemare→pain]
function buyerProfile(){
  let s=0;
  if(answers.q3!==null) s += Q3_TILT[answers.q3] ?? 0;
  if(answers.q4!==null) s += Q4_TILT[answers.q4] ?? 0;
  const profile = s>0 ? "optimist" : "pessimist";   // s<=0 → fájdalom-default
  const confidence = Math.abs(s)>=2 ? "clear" : "lean";
  return {profile, tilt:s, confidence};
}

const MIN_PRODUCTIVE  = 4;          // min. termelő ember
const MIN_TURNOVER_AN = 1500000;    // min. ÉVES forgalom (RON)
function hardGate(){
  const ppl = people || 0;
  const ta  = cifraUnknown ? null : (cifraAnuala || 0);
  if(ppl < MIN_PRODUCTIVE) return {pass:false, reason:"too_small"};        // < 4 termelő
  if(ta === null)          return {pass:false, reason:"turnover_unknown"}; // nincs forgalmi adat → verificare
  if(ta < MIN_TURNOVER_AN) return {pass:false, reason:"below_turnover"};   // < 1,5M RON/év
  return {pass:true, reason:"ok"};
}

function ctaCopy(t, tier, q3, q4){
  const ro = lang==="ro";
  const h1map = ro ? [
    "Cifrele din bilanț îți arată ce a rămas. Nu îți arată ce s-a pierdut pe drum.",
    "Un Excel nu e un sistem de producție.",
    "Datele contabile îți arată realitatea. Auditul îți arată potențialul.",
    "Ai un soft. Dar știi ce produce fiecare post azi?"
  ] : [
    "A mérleg számai megmutatják mi maradt. Azt nem mutatják, mi veszett el közben.",
    "Egy Excel nem termelésirányítási rendszer.",
    "A könyvelési adatok a valóságot mutatják. Az audit a potenciált mutatja.",
    "Van szoftvered. De tudod, mit termel ma minden posztod?"
  ];
  const pmap = ro ? [
    "Orele pierdute zilnic nu apar în niciun raport. Auditul le scoate la suprafață.",
    "Profitul real se vede doar când știi câte ore ai facturat față de câte ai putut.",
    "Furnizorii aglomerează pentru că nu există previziune. Asta se rezolvă cu sistem.",
    "Banii pleacă pe unde nu se vede. Auditul îți arată exact unde."
  ] : [
    "A naponta elveszett órák semmilyen riportban nem szerepelnek. Az audit felszínre hozza őket.",
    "A valós profitot csak akkor látod, ha tudod hány órát számláztak ki a lehetségeshez képest.",
    "A torlódó számlák oka: nincs előrejelzés. Rendszerrel megoldható.",
    "A pénz ott folyik el, ahol nem látszik. Az audit pontosan megmutatja hol."
  ];
  /* ===== személyre szabott zárás: PROFIL × CIFRA × CEA MAI MARE PROBLEMĂ (q4) ===== */
  const c=compute(), bp=buyerProfile();
  const hasNum = c && !c.inconsistent && !c.dataUnknown;
  const caStr  = (!cifraUnknown && cifraAnuala) ? fmt(cifraAnuala) : null;
  const xanStr = hasNum ? fmt(c.Xan) : null;
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  /* q4 (cea mai mare problemă) rövid címke, profil szerint hangolva */
  const probTag = ro ? [
    bp.profile==="optimist" ? "orele care se pot recâștiga din haos" : "orele care se pierd zilnic în haos",
    "profitul real pe care încă nu-l vezi",
    "aprovizionarea care fură ore de producție",
    "banii care pleacă pe unde nu se vede"
  ] : [
    bp.profile==="optimist" ? "a káoszból visszanyerhető órák" : "a káoszban naponta elvesző órák",
    "a valós profit, amit még nem látsz",
    "a beszerzés, ami termelési órát lop",
    "a pénz, ami láthatatlanul elfolyik"
  ];
  const tag = probTag[q4??0];
  const urg = ro
    ? {A:"Hai să-l vedem live, în 48 de ore — pe service-ul tău.", B:"Cere auditul — în 48 de ore știi cifra exactă.", C:"Primul pas e gratuit: trimiți datele, primești raportul real."}
    : {A:"Nézzük meg élőben, 48 órán belül — a saját szervizeden.", B:"Kérj auditot — 48 órán belül tudod a pontos számot.", C:"Az első lépés ingyenes: elküldöd az adatokat, kapsz egy valós riportot."};
  let close;
  if(bp.profile==="optimist"){
    close = (caStr && xanStr)
      ? (ro ? `La o cifră de ~${caStr} RON/an, ${tag} e potențial real — ~${xanStr} RON deja prezenți în atelier. ${urg[tier]}`
            : `~${caStr} RON/év forgalomnál ${tag} valódi potenciál — ~${xanStr} RON már bent van a műhelyben. ${urg[tier]}`)
      : (ro ? `${cap(tag)} — potențial care iese la audit. ${urg[tier]}`
            : `${cap(tag)} — ez a potenciál az auditon jön ki. ${urg[tier]}`);
  } else {
    close = (caStr && xanStr)
      ? (ro ? `La o cifră de ~${caStr} RON/an, ${tag} înseamnă ~${xanStr} RON pierduți — nu din lipsă de clienți, ci de sistem. ${urg[tier]}`
            : `~${caStr} RON/év forgalomnál ${tag} ~${xanStr} RON veszteséget jelent — nem ügyfélhiányból, hanem rendszerhiányból. ${urg[tier]}`)
      : (ro ? `${cap(tag)} — pierdere tăcută, fără sistem. ${urg[tier]}`
            : `${cap(tag)} — csendes veszteség, rendszer nélkül. ${urg[tier]}`);
  }
  return {h1:h1map[q3??0], p:pmap[q4??0], close};
}

function countUp(el, to){
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce){ el.textContent=fmt(to)+" RON"; return; }
  const dur=900, t0=performance.now();
  function tick(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=fmt(Math.round(to*e))+" RON";
    if(k<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function gaugeSVG(perDay){
  const MIN=3, MAX=8;                          // óra/nap/poszt skála
  const pct=Math.max(0,Math.min(1,(perDay-MIN)/(MAX-MIN)));
  const t65=(6.5-MIN)/(MAX-MIN), t72=(7.2-MIN)/(MAX-MIN);  // piros<6,5 · sárga6,5–7,2 · zöld7,2+
  const a=Math.PI*(1-pct);
  const cx=165,cy=150,r=120;
  const nx=cx+Math.cos(a)*r, ny=cy-Math.sin(a)*r;
  const arc=(t0,t1,col)=>{
    const A0=Math.PI*(1-t0), A1=Math.PI*(1-t1);
    const x0=cx+Math.cos(A0)*r, y0=cy-Math.sin(A0)*r;
    const x1=cx+Math.cos(A1)*r, y1=cy-Math.sin(A1)*r;
    return '<path d="M'+x0+' '+y0+' A'+r+' '+r+' 0 0 1 '+x1+' '+y1+'" stroke="'+col+'" stroke-width="12" fill="none" stroke-linecap="round"/>';
  };
  return '<svg class="gauge" viewBox="0 0 330 175" role="img" aria-label="ore/zi">'
    + arc(0,t65,'var(--loss)') + arc(t65,t72,'var(--warn)') + arc(t72,1,'var(--recover)')
    + '<g font-family="JetBrains Mono" font-size="10" fill="var(--faint)"><text x="26" y="168">3 h</text><text x="278" y="168">8 h</text></g>'
    + '<line x1="'+cx+'" y1="'+cy+'" x2="'+nx+'" y2="'+ny+'" stroke="var(--text)" stroke-width="3" stroke-linecap="round" style="transition:all .9s cubic-bezier(.2,.9,.2,1)"/>'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="var(--text)"/></svg>';
}

      <div class="sliders" style="margin-top:16px">
        <label class="sl"><span class="sl-top">${t.sl_tarif} <b id="q2tarifval" style="color:${tarifCol(tarif)}">${fmt(tarif)} ${t.lei}</b></span>
          <input type="range" id="q2tarifS" class="track-zone" min="100" max="600" step="5" value="${tarif}" aria-label="${t.sl_tarif}"></label>
      </div>
      <div class="sliders" style="margin-top:16px">

        <label class="sl"><span class="sl-top">${t.q2_split} <b id="q2split"${splitUnknown?' style="color:var(--faint)"':''}>${t.piese} ${pie}% · ${t.mano_w} ${mano}%</b></span>

      <div class="grow"></div>${navHTML()}`;
  }
  else if(isQuestion(key)){
    const qn=["q1","q2","q3","q4"].indexOf(key)+1;
    const titles={q1:t.q1,q2:t.q2,q3:t.q3,q4:t.q4};
    const opts={q1:t.q1o,q2:Q2,q3:t.q3o,q4:t.q4o}[key];
    html=`<div class="eyebrow">${t.q} ${qn} ${t.of} 4</div><h1 style="font-size:clamp(1.3rem,5vw,1.7rem)">${titles[key]}</h1>
      <div class="opts">${opts.map((o,i)=>`
        <button class="opt" role="button" aria-pressed="${answers[key]===i}" data-pick="${i}">
          <span>${o}</span><span class="tick"></span></button>`).join("")}</div>
      <div class="grow"></div>${navHTML()}`;
  }
  else if(key==="mirror"){
    const c0=compute();
    if(!c0){
      html=`<div class="eyebrow">${t.mir_eye}</div><p class="sub">${t.mir_need}</p><div class="grow"></div>${navHTML()}`;
    } else if(c0.dataUnknown){
      html=`<div class="eyebrow">${t.mir_eye}</div>
        <div class="verify"><div class="vh">⚠ ${t.unknown_h}</div>
          <p class="sub" style="margin:0">${t.unknown_p}</p></div>
        <div class="grow"></div>${navHTML()}`;
    } else {
      const ver=c0.verifyReason, pc=utilCol(c0.perDay);
      const vH = ver==='low'?t.v_low_h : ver==='incoh'?t.v_incoh_h : t.v_h;
      const vBody = ver==='low'?t.v_low_p : ver==='incoh'?t.v_incoh_p
                  : `${t.v_p1} <b id="vPerDay" style="color:var(--warn)">${c0.perDay.toFixed(1)}</b> ${t.v_p2}`;
      html=`<div class="eyebrow">${t.mir_eye}</div>
      <div id="mirrorVerify" style="display:${ver?'block':'none'}">
        <div class="verify"><div class="vh">⚠ ${vH}</div>
          <p class="sub" style="margin:0">${vBody}</p></div>
      </div>
      <div id="mirrorNormal" style="display:${ver?'none':'block'}">
        ${!finTouched?`<div id="provBanner" class="verify" style="border-color:var(--warn);margin-bottom:12px"><div class="vh">⚙ ${t.prov_h}</div><p class="sub" style="margin:0">${t.prov_p}</p></div>`:''}
        <div id="gaugeWrap">${gaugeSVG(c0.perDay)}</div>
        <div class="prodline">${t.mir_perday}: <b id="perDay" style="color:${pc}">${c0.perDay.toFixed(1)} ${t.h_ora}/${t.post}</b><span class="exp-pill" id="expertBadge" style="display:${c0.expert?'inline-block':'none'}">${t.expert}</span> · <span class="tgt">${t.tgt_green}</span></div>
        <div class="prodline" id="profitLine">${profitLine(c0)}</div>
        <div class="mirror-split">
          <div class="mirror-left" id="headline" style="${!finTouched?'opacity:.6':''}">
            <div class="readout">
              <div class="x" id="xnum">0 RON</div>
              <div class="xlab">${t.mir_xlab}</div>
              <div class="xsub" id="xsub">${fmt(c0.X)} ${t.lei}/${t.luna} × 12</div>
              <div class="prodref" id="prodref">${t.mir_prod_ref.replace("{p}", fmt(c0.F*12))}</div>
            </div>
            <div class="rec"><span class="zl">${t.mir_zl}</span><span class="z" id="znum">0</span></div>
            <div class="recsub" id="zsub">${fmt(c0.Zan)} ${t.lei}/${t.an}</div>
            <div class="partsrow" id="partsRow">+ <b id="partsLossNum" style="color:var(--loss)">${fmt(c0.partsLossAn)}</b> ${t.lei}/${t.an} <span class="pl-tag">${t.parts_lab}</span> · <span style="color:var(--recover)">${t.recoverable_short} <b id="partsRecovNum">${fmt(c0.partsRecovAn)}</b></span></div>
          </div>
          <div class="mirror-right">
            <div class="meters-h">${t.meters_title}</div>
            <div class="meter prime">
              <div class="meter-top"><span class="mn">${t.m_mano} <span class="drv">${t.m_driver}</span></span><span class="mv"><b id="mManoV">${fmt(c0.actualManopera)}</b> → <span id="mManoBench" style="color:var(--recover)">${fmt(c0.benchManopera)}</span></span></div>
              <div class="meter-track"><i id="mManoBar" style="width:${c0.fillMano}%;background:${fillCol(c0.fillMano)}"></i></div>
              <div class="meter-pct"><b id="mManoPct" style="color:var(--text)">${c0.fillMano}</b>% ${t.m_acum} · <b id="mManoGap" style="color:var(--recover)">${100-c0.fillMano}</b>% ${t.m_realiz}</div>
            </div>
            <div class="meter">
              <div class="meter-top"><span class="mn">${t.m_cifra}</span><span class="mv"><b id="mCifraV">${fmt(c0.actualCifraSvc)}</b> → <span id="mCifraBench" style="color:var(--recover)">${fmt(c0.benchCifra)}</span></span></div>
              <div class="meter-track"><i id="mCifraBar" style="width:${c0.fillCifra}%;background:${fillCol(c0.fillCifra)}"></i></div>
              <div class="meter-pct"><b id="mCifraPct" style="color:var(--text)">${c0.fillCifra}</b>% ${t.m_acum} · <b id="mCifraGap" style="color:var(--recover)">${100-c0.fillCifra}</b>% ${t.m_realiz}</div>
            </div>

          </div><!-- mirror-right -->
        </div><!-- mirror-split -->
        <div class="cta-close" id="profileMsg" style="margin-top:14px;border-left-color:${buyerProfile().profile==='optimist'?'var(--recover)':'var(--loss)'}">${profileMsg(c0)}</div>
      </div>

      ${stdPanelHTML()}
      <p class="assume">${t.assume}</p>
      <p class="note">${t.mir_note}</p><div class="grow"></div>${navHTML()}`;
    }
  }
  else if(key==="cta"){
    const cc=compute();
    let recap="";
    if(cc){
      if(cc.verifyReason){
        recap=`<div class="cta-recap"><div class="cr-lab">${t.cta_rec}</div>
          <p class="sub" style="margin:0">${t.cta_rec_incon}</p></div>`;
      } else if(cc.dataUnknown){
        recap=`<div class="cta-recap"><div class="cr-lab">${t.cta_rec}</div>
          <p class="sub" style="margin:0">${t.unknown_p}</p></div>`;
      } else if(!finTouched){
        recap=`<div class="cta-recap"><div class="cr-lab">${t.cta_rec}</div>
          <p class="sub" style="margin:0">${t.prov_p}</p></div>`;
      } else {
        recap=`<div class="cta-recap"><div class="cr-lab">${t.cta_rec}</div>
          <div class="readout"><div class="x" style="color:var(--loss)">${fmt(cc.Xan)} RON</div><div class="xlab">${t.mir_xlab}</div>
            <div class="prodref">${t.mir_prod_ref.replace("{p}", fmt(cc.F*12))}</div></div>
          <div class="rec"><span class="zl">${t.mir_zl}</span><span class="z">${fmt(cc.Z)} RON</span></div>
          <div class="recsub">${fmt(cc.Zan)} ${t.lei}/${t.an}</div></div>`;
      }
    }
    const sc=score(), cx=ctaCopy(t, sc.tier, answers.q3, answers.q4);
    const recoverLabel = t.cta_recover;
    html=`<div class="eyebrow">${t.cta_eye} · <span class="tier ${sc.tier}">TIER ${sc.tier}</span></div>
      <h1 style="font-size:clamp(1.2rem,5vw,1.55rem)">${cx.h1}</h1>
      <p class="sub">${cx.p}</p>
      ${recap}
      <div class="cta-close">${cx.close}</div>
      <div class="grow"></div>
      <div id="ctaMain">
        <div class="nav"><button class="btn primary" id="ctaBtn">${recoverLabel}</button></div>
        <button class="btn ghost cta-sec" data-act="back" style="margin-top:8px">${t.back}</button>
      </div>
      <div id="ctaEmail" style="display:none">
        <p class="sub" style="margin-bottom:8px">${t.cta_email_p}</p>
        <input type="email" id="ctaEmailInp" placeholder="${t.cta_email_ph}" style="width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:1rem;box-sizing:border-box;margin-bottom:10px">
        <div class="nav"><button class="btn primary" id="ctaSubmit">${t.cta_email_btn}</button></div>
        <button class="btn ghost cta-sec" id="ctaCancel" style="margin-top:8px">${t.back}</button>
      </div>`;
  }
  card.innerHTML=html;

  card.querySelectorAll("[data-pick]").forEach(b=>{
    b.addEventListener("click",()=>{ answers[key]=+b.dataset.pick; render(); });
  });
  card.querySelectorAll("[data-act]").forEach(b=>{
    b.addEventListener("click",()=>{
      const a=b.dataset.act;
      if(a==="next") go(1);
      else if(a==="back") go(-1);

  });
  if(key==="cta"){
    const btnMain=document.getElementById("ctaBtn"), main=document.getElementById("ctaMain"), emailDiv=document.getElementById("ctaEmail");
    const inp=document.getElementById("ctaEmailInp"), sub=document.getElementById("ctaSubmit"), can=document.getElementById("ctaCancel");
    if(btnMain) btnMain.addEventListener("click",()=>{ main.style.display="none"; emailDiv.style.display="block"; inp.focus(); });
    if(can) can.addEventListener("click",()=>{ emailDiv.style.display="none"; main.style.display="block"; });
    if(sub) sub.addEventListener("click",()=>{

      emailDiv.innerHTML=`<div style="text-align:center;padding:18px 0"><div style="font-size:2rem">✓</div><p class="sub" style="margin:8px 0 0">${T[lang].cta_email_ok}</p></div>`;
      toast(T[lang].toast);

  }

  if(key==="mirror"){
    const c=compute();
    if(c && !c.verifyReason && !c.dataUnknown){
      const xn=document.getElementById("xnum"), zn=document.getElementById("znum");
      if(finTouched){
        requestAnimationFrame(()=>{ if(xn) countUp(xn, c.Xan); if(zn) zn.textContent=fmt(c.Z)+" RON"; });
      } else {                                   // P1: provizórikus → nincs drámai felszámolás, ≈ jelzéssel statikus
        if(xn) xn.textContent="≈ "+fmt(c.Xan)+" RON";
        if(zn) zn.textContent="≈ "+fmt(c.Z)+" RON";
      }
    }
    const ms=document.getElementById("manoSlider");
    if(ms) ms.addEventListener("input",()=>{ manopera=+ms.value;
      if(!finTouched){ finTouched=true; render(); }   // első bevételi érintés → élesít (banner el, dim le)
      else updateMirror(); });
    /* STANDARD panel — optimalizáló pontok; minden frissítés recalcStd()+updateMirror() */
    const _std=(id,vid,fn,fmtv)=>{ const e=document.getElementById(id); if(e) e.addEventListener("input",()=>{ fn(+e.value); recalcStd(); setT(vid,fmtv(+e.value)); updateMirror(); }); };
    _std("stdTarget","stdTargetV",v=>TARGET=v, v=>v.toFixed(1)+" "+T[lang].std_h);
    _std("stdZile","stdZileV",v=>ZILE_AN=v, v=>String(v));
    _std("stdOpcBase","stdOpcBaseV",v=>OPC_BASE=v/100, v=>v+"%");
    _std("stdOpcSlope","stdOpcSlopeV",v=>OPC_SLOPE=v/100, v=>v.toFixed(1)+" "+T[lang].std_pp);
    _std("stdPartsBase","stdPartsBaseV",v=>PARTS_BASE=v/100, v=>v+"%");
    _std("stdPartsSlope","stdPartsSlopeV",v=>PARTS_SLOPE=v/100, v=>v.toFixed(1)+" "+T[lang].std_pp);
  }
  if(key==="q1"){
    const setBucket=()=>{ answers.q1 = posts<=2?0:posts<=4?1:posts<=6?2:3; };
    const refresh=()=>{ const u=Math.min(people,posts); setT("q1bottle",u); setT("q1u",u); setT("q1ut",u); setT("q1pot",fmt(TARGET*u*ZILE_AN)); setT("q1potT",fmt((POTENTIAL-TARGET)*u*ZILE_AN)); setBucket(); updateAdmin(); };
    const ps=document.getElementById("q1postsS"), pe=document.getElementById("q1peopleS");
    if(ps) ps.addEventListener("input",()=>{ posts=nlVal(ps.value); setT("q1posts",posts); refresh(); });
    if(pe) pe.addEventListener("input",()=>{ people=nlVal(pe.value); setT("q1people",people); refresh(); });
    const sa=document.getElementById("q1salS");
    if(sa) sa.addEventListener("input",()=>{ salNet=+sa.value; setT("q1sal",fmt(salNet)+" "+T[lang].lei); setT("q1bench",salFloor().breakeven); updateAdmin(); });
    setBucket();
  }
  if(key==="q2"){
    const setBucket=()=>{ answers.q2 = cifra<50000?0:cifra<150000?1:cifra<300000?2:3; };
    const s=document.getElementById("q2S"), snum=document.getElementById("q2num");
    const syncCifra=()=>{ cifra=Math.round(cifraAnuala/12); cifraUnknown=false; finTouched=true;
      setT("q2val", fmt(cifraAnuala)+" "+t.lei); setT("q2perlu", fmt(cifra)+" "+t.lei);
      setT("q2net", fmt(Math.round(cifraAnuala*(1-altePct)))+" "+t.lei+"/"+t.an); setBucket(); updateAdmin(); };
    if(s) s.addEventListener("input",()=>{ cifraAnuala=caVal(s.value); if(snum) snum.value=cifraAnuala; syncCifra(); });
    if(snum) snum.addEventListener("input",()=>{ const v=parseInt(snum.value,10);
      if(!isNaN(v)&&v>0){ cifraAnuala=Math.min(CA_MAX,v); if(s) s.value=caPos(cifraAnuala); syncCifra(); } });
    const u=card.querySelector("[data-q2unknown]");
    if(u) u.addEventListener("click",()=>{ cifraUnknown=!cifraUnknown; render(); });
    const ss=document.getElementById("q2splitS");
    if(ss) ss.addEventListener("input",()=>{ const m=+ss.value; laborPct=m/100; splitUnknown=false; setT("q2split", t.piese+" "+(100-m)+"% · "+t.mano_w+" "+m+"%"); updateAdmin(); });
    const as=document.getElementById("q2alteS");
    if(as) as.addEventListener("input",()=>{ altePct=(+as.value)/100; setT("q2alteval", (+as.value)+"%"); setT("q2net", fmt(Math.round(cifraAnuala*(1-altePct)))+" "+t.lei+"/"+t.an); updateAdmin(); });
    const ts=document.getElementById("q2tarifS");
    if(ts) ts.addEventListener("input",()=>{ tarif=+ts.value; const tv=document.getElementById("q2tarifval"); if(tv){ tv.textContent=fmt(tarif)+" "+t.lei; tv.style.color=tarifCol(tarif); } updateAdmin(); });
    const su=card.querySelector("[data-splitunknown]");
    if(su) su.addEventListener("click",()=>{ splitUnknown=!splitUnknown; if(splitUnknown) laborPct=0.45; render(); });
    setBucket();
  }
  updateAdmin();
}

function updateMirror(){
  const c=compute(); if(!c){ render(); return; }
  if(c.dataUnknown){ render(); return; }
  const t=T[lang], pc=utilCol(c.perDay);
  const mn=document.getElementById("mirrorNormal");
  const wasVerify = mn && mn.style.display==="none";
  if(c.verifyReason || wasVerify){ render(); return; }   // P2/P3: verify-mód váltás → teljes újrarajzolás a helyes panellel
  /* leverek */
  setT("peopleVal", c.PE); setT("postsVal", c.P); setT("manoVal", fmt(c.F)+" "+t.lei);
  /* normál panel */
  const gw=document.getElementById("gaugeWrap"); if(gw) gw.innerHTML=gaugeSVG(c.perDay);
  const pd=document.getElementById("perDay"); if(pd){ pd.textContent=c.perDay.toFixed(1)+" "+t.h_ora+"/"+t.post; pd.style.color=pc; }
  const eb=document.getElementById("expertBadge"); if(eb) eb.style.display=c.expert?"inline-block":"none";
  setT("xnum", fmt(c.Xan)+" RON"); setT("znum", fmt(c.Z)+" RON");
  setT("xsub", fmt(c.X)+" "+t.lei+"/"+t.luna+" × 12"); setT("prodref", t.mir_prod_ref.replace("{p}", fmt(c.F*12)));
  setT("zsub", fmt(c.Zan)+" "+t.lei+"/"+t.an);
  setT("partsLossNum", fmt(c.partsLossAn)); setT("partsRecovNum", fmt(c.partsRecovAn));
  /* 3 mérőóra: kellene vs van */
  setT("mManoV", fmt(c.actualManopera)); setT("mManoBench", fmt(c.benchManopera)); const mmb=document.getElementById("mManoBar"); if(mmb){ mmb.style.width=c.fillMano+"%"; mmb.style.background=fillCol(c.fillMano); } setT("mManoPct", c.fillMano); setT("mManoGap", 100-c.fillMano);
  setT("mCifraV", fmt(c.actualCifraSvc)); setT("mCifraBench", fmt(c.benchCifra)); const mcb=document.getElementById("mCifraBar"); if(mcb){ mcb.style.width=c.fillCifra+"%"; mcb.style.background=fillCol(c.fillCifra); } setT("mCifraPct", c.fillCifra); setT("mCifraGap", 100-c.fillCifra);
  const pib=document.getElementById("postincBlock"); if(pib) pib.style.display=c.emptyLifts>0?"flex":"none";
  setT("piVal", fmt(c.venitPerPost)); setT("piSub", t.pi_sub.replace("{u}", c.utilPost));
  const pm=document.getElementById("profileMsg");
  if(pm){ pm.innerHTML=profileMsg(c); pm.style.borderLeftColor = buyerProfile().profile==="optimist"?"var(--recover)":"var(--loss)"; }
  const plLine=document.getElementById("profitLine"); if(plLine) plLine.innerHTML=profitLine(c);
  updateAdmin();
}

function navHTML(){
  const t=T[lang], key=STEPS[step];
  const lock = isQuestion(key) && answers[key]===null;
  return `<div class="nav">
    <button class="btn ghost" data-act="back">${t.back}</button>
    <button class="btn primary" data-act="next" ${lock?"disabled":""}>${t.next}</button>
  </div>`;
}
function go(d){
  const key=STEPS[step];
  if(d>0 && isQuestion(key) && answers[key]===null) return;
  step=Math.max(0,Math.min(STEPS.length-1,step+d));
  card.scrollIntoView({behavior:"smooth",block:"nearest"});
  render();
}
function updateAdmin(){
